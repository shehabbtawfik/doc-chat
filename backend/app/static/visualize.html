<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DocuMind — Vector Space</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050a14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #canvas-container { position: fixed; inset: 0; }
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: linear-gradient(to bottom, rgba(5,10,20,0.95), transparent);
  }
  #header .brand { display: flex; align-items: center; gap: 10px; }
  #header .brand .dot { width: 28px; height: 28px; border-radius: 8px; background: #4f6ef7; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  #header .brand h1 { font-size: 16px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.3px; }
  #header .brand span { font-size: 13px; color: #64748b; margin-left: 4px; }
  #header a { font-size: 13px; color: #4f6ef7; text-decoration: none; padding: 6px 14px; border: 1px solid #4f6ef7; border-radius: 8px; transition: all 0.2s; }
  #header a:hover { background: #4f6ef7; color: white; }

  #legend {
    position: fixed; bottom: 24px; left: 20px; z-index: 10;
    background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 14px 16px; min-width: 180px;
    backdrop-filter: blur(12px);
  }
  #legend h3 { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 13px; color: #cbd5e1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #stats {
    position: fixed; bottom: 24px; right: 20px; z-index: 10;
    background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 14px 16px;
    backdrop-filter: blur(12px); text-align: right;
  }
  #stats p { font-size: 12px; color: #64748b; margin-bottom: 4px; }
  #stats .num { font-size: 22px; font-weight: 700; color: #f1f5f9; }
  #stats .label { font-size: 11px; color: #64748b; }

  #tooltip {
    position: fixed; z-index: 20; pointer-events: none;
    background: rgba(15,23,42,0.95); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 12px 14px; max-width: 280px;
    display: none; backdrop-filter: blur(16px);
  }
  #tooltip .tip-title { font-size: 12px; font-weight: 600; color: #4f6ef7; margin-bottom: 5px; }
  #tooltip .tip-text { font-size: 12px; color: #94a3b8; line-height: 1.5; }

  #loading {
    position: fixed; inset: 0; z-index: 30; background: #050a14;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  #loading .spinner { width: 36px; height: 36px; border: 3px solid rgba(79,110,247,0.2); border-top-color: #4f6ef7; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 14px; color: #64748b; }

  #error-msg {
    position: fixed; inset: 0; z-index: 30; background: #050a14;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  }
  #error-msg p { font-size: 15px; color: #94a3b8; }
  #error-msg a { color: #4f6ef7; }

  #hint {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #475569; z-index: 10; pointer-events: none;
    animation: fadeout 3s 2s forwards;
  }
  @keyframes fadeout { to { opacity: 0; } }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Loading vector space…</p></div>
<div id="error-msg"><p>No documents indexed yet. <a href="/">Upload a document</a> first.</p></div>

<div id="canvas-container"></div>

<div id="header">
  <div class="brand">
    <div class="dot">✦</div>
    <h1>DocuMind</h1>
    <span>— Vector Space</span>
  </div>
  <a href="/">← Back to Chat</a>
</div>

<p id="hint">Drag to rotate · Scroll to zoom · Hover a point to inspect</p>

<div id="legend"><h3>Documents</h3></div>
<div id="stats"></div>
<div id="tooltip"><div class="tip-title" id="tip-title"></div><div class="tip-text" id="tip-text"></div></div>

<script>
const COLORS = ['#4f6ef7','#f97316','#22d3ee','#a78bfa','#34d399','#fb7185','#fbbf24','#60a5fa'];
const API = window.location.origin;

async function init() {
  let data;
  try {
    const res = await fetch(`${API}/api/vectors/3d`);
    if (!res.ok) throw new Error(await res.text());
    data = await res.json();
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').style.display = 'flex';
    return;
  }

  document.getElementById('loading').style.display = 'none';

  // Legend
  const docColorMap = {};
  data.documents.forEach((d, i) => {
    docColorMap[d.doc_id] = COLORS[i % COLORS.length];
  });

  const legend = document.getElementById('legend');
  data.documents.forEach((d, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${COLORS[i % COLORS.length]}"></div><span>${d.title}</span>`;
    legend.appendChild(item);
  });

  // Stats
  const v = data.variance_explained;
  const pctStr = v.length >= 3 ? `${Math.round((v[0]+v[1]+v[2])*100)}%` : '—';
  document.getElementById('stats').innerHTML = `
    <p class="num">${data.total_chunks}</p><p class="label">chunks indexed</p>
    <p style="margin-top:8px" class="num" style="font-size:16px">${pctStr}</p><p class="label">variance captured</p>`;

  // Three.js scene
  const container = document.getElementById('canvas-container');
  const W = window.innerWidth, H = window.innerHeight;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, W/H, 0.01, 100);
  camera.position.set(0, 0, 3.5);

  // Ambient + point lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const pl = new THREE.PointLight(0x4f6ef7, 2, 10);
  pl.position.set(2, 2, 2);
  scene.add(pl);

  // Starfield background
  const starGeo = new THREE.BufferGeometry();
  const starVerts = [];
  for(let i = 0; i < 2000; i++) {
    starVerts.push((Math.random()-0.5)*40, (Math.random()-0.5)*40, (Math.random()-0.5)*40);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x334155, size: 0.04 })));

  // Spheres for each chunk
  const spheres = [];
  const geo = new THREE.SphereGeometry(0.028, 10, 10);

  data.points.forEach(pt => {
    const color = docColorMap[pt.doc_id] || '#4f6ef7';
    const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.3, roughness: 0.4, metalness: 0.3 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pt.x, pt.y, pt.z);
    mesh.userData = { title: pt.title, preview: pt.preview, color };
    scene.add(mesh);
    spheres.push(mesh);
  });

  // Grid helper
  const grid = new THREE.GridHelper(4, 20, 0x1e293b, 0x1e293b);
  grid.position.y = -1.2;
  scene.add(grid);

  // Mouse interaction
  const raycaster = new THREE.Raycaster();
  raycaster.params.Points.threshold = 0.05;
  const mouse = new THREE.Vector2(-9999, -9999);
  const tooltip = document.getElementById('tooltip');
  let hovered = null;

  window.addEventListener('mousemove', e => {
    mouse.x = (e.clientX / W) * 2 - 1;
    mouse.y = -(e.clientY / H) * 2 + 1;
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY - 10) + 'px';
  });

  // Orbit controls (manual)
  let isDragging = false, prevX = 0, prevY = 0;
  let rotX = 0, rotY = 0;
  const pivot = new THREE.Group();
  scene.add(pivot);
  spheres.forEach(s => { scene.remove(s); pivot.add(s); });
  grid.position.y = -1.3;
  pivot.add(grid);

  renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
  window.addEventListener('mouseup', () => isDragging = false);
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    rotY += (e.clientX - prevX) * 0.005;
    rotX += (e.clientY - prevY) * 0.005;
    prevX = e.clientX; prevY = e.clientY;
  });
  renderer.domElement.addEventListener('wheel', e => {
    camera.position.z = Math.min(8, Math.max(1.2, camera.position.z + e.deltaY * 0.005));
  });

  let autoRot = 0;

  function animate() {
    requestAnimationFrame(animate);
    if (!isDragging) autoRot += 0.003;
    pivot.rotation.y = autoRot + rotY;
    pivot.rotation.x = rotX;

    // Raycast hover
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(spheres);
    if (hits.length > 0) {
      const obj = hits[0].object;
      if (obj !== hovered) {
        if (hovered) hovered.material.emissiveIntensity = 0.3;
        hovered = obj;
        hovered.material.emissiveIntensity = 1.2;
        document.getElementById('tip-title').textContent = obj.userData.title;
        document.getElementById('tip-text').textContent = obj.userData.preview;
        tooltip.style.display = 'block';
      }
    } else {
      if (hovered) { hovered.material.emissiveIntensity = 0.3; hovered = null; }
      tooltip.style.display = 'none';
    }

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

init();
</script>
</body>
</html>
